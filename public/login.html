<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — VelvetPlay</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">Velvet<span>Play</span></div>
    <h2>Welcome Back</h2>
    <p class="auth-sub">Login karo aur premium content enjoy karo</p>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@email.com" required />
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" required />
      <button type="submit" id="submitBtn">Login</button>
    </form>

    <p id="error" class="auth-error"></p>

    <p class="auth-footer">
      Naya user ho? <a href="/signup.html">Account banao</a>
    </p>
  </div>

  <script src="/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('error');
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Logging in...';

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      btn.disabled = false; btn.textContent = 'Login';

      if (!res.ok) { err.textContent = data.error || 'Login fail'; return; }
      Auth.setToken(data.token);
      Auth.setUser(data.user);
      location.href = '/';
    });
  </script>
</body>
</html>
