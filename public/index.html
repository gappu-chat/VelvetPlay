<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>VelvetPlay — Premium Videos</title>
  <link rel="stylesheet" href="/style.css?v=52" />
  <style>
    /* Perfect Header Layout */
    .header-top { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
    .logo { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; cursor: pointer; margin-right: 4px; }
    .search { flex: 1; min-width: 80px; padding: 10px 14px; font-size: 14px; margin: 0 4px; background: #1F2937; border: 1px solid #2A3441; border-radius: 8px; color: #fff; outline: none; }
    .search:focus { border-color: #3B82F6; }
    
    /* Bell Icon Styling */
    .bell-container { position: relative; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: #1F2937; cursor: pointer; flex-shrink: 0; }
    .bell-container svg { width: 20px; height: 20px; fill: #fff; }
    .bell-badge { position: absolute; top: -2px; right: -2px; background: #EF4444; color: #fff; font-size: 10px; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #0B0F19; }
    
    .user-btn { width: 36px; height: 36px; font-size: 14px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #3B82F6; border-radius: 50%; color: #fff; font-weight: bold; border: 0; }
    .user-btn.login-state { background: #3B82F6; border-radius: 8px; width: auto; padding: 0 12px; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="logo" onclick="location.href='/'">Velvet<span>Play</span></div>
      
      <!-- SEARCH BAR WAPAS BADA -->
      <input class="search" id="search" placeholder="Search movies, tags..." />
      
      <!-- NOTIFICATION BELL -->
      <div class="bell-container" onclick="location.href='/notifications.html'">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
        <span class="bell-badge" id="notifBadge" style="display:none;">0</span>
      </div>

      <button class="user-btn login-state" id="userBtn" onclick="userClick()">Login</button>
    </div>
    <div class="categories" id="categories"></div>
  </header>

  <div id="homeBannerArea">
    <div class="premium-promo" onclick="location.href='/subscription.html'">
      <div><h3>👑 Velvet Premium</h3><p>Unlock all content at just ₹500/month</p></div>
      <button>View Plans</button>
    </div>
    <div class="hero" id="hero" style="min-height: 200px; background: #151B2B; display: flex; align-items: center; justify-content: center;">
      <span style="color: #9CA3AF;">Loading Banner...</span>
    </div>
  </div>
  
  <div id="continueSection" style="display:none;">
    <div class="section-title">Continue Watching</div>
    <div class="grid" id="continueGrid" style="padding-bottom: 10px;"></div>
  </div>

  <div class="section-title" id="grid-title">Latest & Trending</div>
  <div class="grid" id="grid">
    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #9CA3AF;">Loading videos...</div>
  </div>

  <script src="/auth.js"></script>
  <script>
    let currentCategory = 'All', allVideos = [], me = null;
    const categories = ['All', 'Trending', 'New', 'Premium', 'Animation'];

    async function refreshUser() {
      try {
        me = await Auth.fetchMe();
        const btn = document.getElementById('userBtn');
        if (me) { 
          btn.textContent = me.name.charAt(0).toUpperCase(); 
          btn.classList.remove('login-state'); 
          loadContinueWatching();
        } else { 
          btn.textContent = 'Login'; 
          btn.classList.add('login-state'); 
        }
      } catch(e) { console.log("Auth Error", e); }
    }
    function userClick() { location.href = me ? '/account.html' : '/login.html'; }

    async function loadHero() {
      try {
        const res = await fetch('/api/settings');
        const s = await res.json();
        
        let bgImage = 'linear-gradient(135deg, #1E1B4B, #312E81)';
        if (s.banner_image && s.banner_image.trim() !== '') bgImage = `url('${s.banner_image}'), linear-gradient(135deg, #1E1B4B, #312E81)`;
        
        document.getElementById('hero').innerHTML = `
          <div style="width:100%; height:100%; background-image: ${bgImage}; background-size: cover; background-position: center; position: absolute; inset: 0;"></div>
          <div class="hero-overlay" style="position: relative; z-index: 2;">
            <div class="hero-badge">FEATURED MOVIE</div>
            <h2>${s.banner_title || 'Featured Video'}</h2>
            <p>${s.banner_desc || 'Watch exclusive content.'}</p>
            <button class="hero-btn" onclick="buy('${s.banner_video_id}')">▶ Watch Now</button>
          </div>`;
      } catch(e) { 
        document.getElementById('hero').innerHTML = `<span style="color: #EF4444;">Failed to load banner</span>`;
      }
    }

    async function loadContinueWatching() {
      if (!Auth.getToken()) return;
      try {
        const res = await Auth.authFetch('/api/history/continue');
        if(!res.ok) return;
        const items = await res.json();
        if (!items.length) return;
        
        document.getElementById('continueSection').style.display = 'block';
        document.getElementById('continueGrid').innerHTML = items.map(v => {
          const percent = Math.round((v.progress / v.duration) * 100);
          return `
          <div class="card" onclick="buy('${v.id}')">
            <div style="position:relative">
              <img class="card-thumb" src="${v.thumbnail}" loading="lazy"/>
              <div style="position:absolute; bottom:0; left:0; width:100%; height:4px; background:#333;">
                <div style="width:${percent}%; height:100%; background:#3B82F6;"></div>
              </div>
            </div>
            <div class="card-info">
              <div class="card-title">${v.title}</div>
              <div class="card-views" style="font-size:11px; color:#3B82F6;">${percent}% watched</div>
            </div>
          </div>`;
        }).join('');
      } catch(e) { console.log(e); }
    }

    async function loadVideos(q = '') {
      const grid = document.getElementById('grid');
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #9CA3AF;">Fetching videos...</div>`;

      if (q.trim() !== '') {
        document.getElementById('homeBannerArea').style.display = 'none';
        document.getElementById('continueSection').style.display = 'none';
        document.getElementById('categories').style.display = 'none';
        document.getElementById('grid-title').innerText = `Search Results for "${q}"`;
      } else {
        document.getElementById('homeBannerArea').style.display = 'block';
        document.getElementById('categories').style.display = 'flex';
        document.getElementById('grid-title').innerText = 'Latest & Trending';
        if(me) loadContinueWatching();
      }

      try {
        // Direct API Call
        const res = await fetch(`/api/videos?category=${currentCategory}${q ? '&q=' + encodeURIComponent(q) : ''}`);
        
        if(!res.ok) throw new Error("Server error: " + res.status);
        
        const data = await res.json();
        allVideos = data.videos || [];
        
        if (!allVideos.length) { 
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #9CA3AF;">No videos found.</div>`; 
          return; 
        }

        grid.innerHTML = allVideos.map(v => `
          <div class="card" onclick="buy('${v.id}')">
            <div style="position:relative">
              <img class="card-thumb" src="${v.thumbnail}" loading="lazy" onerror="this.src='https://picsum.photos/400/300'"/>
              <div class="card-overlay">${v.is_free ? '<span class="badge free">FREE</span>' : '<span class="badge premium">PREMIUM</span>'}</div>
              <span class="duration-badge">10:00</span>
            </div>
            <div class="card-info">
              <div class="card-title">${v.title || 'Untitled'}</div>
              <div class="card-views">👁️ ${v.views || 0} views</div>
            </div>
          </div>`).join('');
      } catch(e) { 
        console.error(e);
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #EF4444;">Error loading videos. Server issue.</div>`;
      }
    }

    function renderCategories() {
      document.getElementById('categories').innerHTML = categories.map(c =>
        `<div class="cat ${c === currentCategory ? 'active' : ''}" onclick="setCat('${c}')">${c}</div>`).join('');
    }
    function setCat(c) { currentCategory = c; renderCategories(); loadVideos(document.getElementById('search').value); }

    async function buy(videoId) {
      if (!videoId || videoId === 'undefined') return alert('Video link missing.');
      if (!Auth.getToken()) return location.href = '/login.html';
      
      try {
        const res = await Auth.authFetch('/api/create-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ videoId }) });
        const order = await res.json();
        if (order.hasAccess && order.token) return location.href = `/player.html?video=${videoId}&token=${order.token}`;
        return location.href = '/subscription.html';
      } catch(e) { alert('Network error. Please try again.'); }
    }

    let t; 
    document.getElementById('search').addEventListener('input', (e) => { 
      clearTimeout(t); 
      t = setTimeout(() => loadVideos(e.target.value), 400); 
    });
    
    // Start
    renderCategories(); loadHero(); loadVideos(); refreshUser();
  </script>
</body>
</html>
